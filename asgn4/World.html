<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocky World</title>
  </head>

  <body onload="main()">

    <button id="directory"><- Back To Directory</button>
    <script>document.getElementById("directory").addEventListener("click", () => { window.location.href = "https://aegismichael4.github.io/CSE-160/"; });</script>
    <br></br>

    <canvas id="webgl" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>
    <p id="fps" style="margin-top: 0px;"></p>
    <p id="xyz"></p>


    <div>
      <button id="toggle-light" style="margin-top:10px">Toggle Light</button>

      <br>
      <label>Diffuse: R</label>
      <input id="d-red" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">G
      <input id="d-green" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">B
      <input id="d-blue" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">

      <br>
      <label>Specular: R</label>
      <input id="s-red" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">G
      <input id="s-green" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">B
      <input id="s-blue" type="range" min="0" max="1" step=".05" value="1" style="width: 75px">

      <br>
      <label>Position:</label>
      <input id="position" type="range" min="1.57" max="4.71" step=".05" value="3.14" style="width: 280px">
    </div>

    <br>
    <button id="toggle-normals" style="margin-top:10px">Toggle Normals</button>


    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="World.js"></script>
    <script src="Shape.js"></script>
    <script src="Texture.js"></script>
    <script src="Camera.js"></script>
    <script src="Map.js"></script>
  </body>
</html>
